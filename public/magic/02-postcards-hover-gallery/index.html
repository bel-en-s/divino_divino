<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Postcards Hover Gallery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.cdnfonts.com/css/roslindale" rel="stylesheet" />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <footer class="footer" id="footer">
      <div class="footer-content">
        <div class="footer-heading">
          <h2>We Look Forward To Your Visit</h2>
        </div>

        <div class="footer-button-container">
          <a
            href="#"
            class="slide-button"
            data-label="Plan Your Visit"
          >
            <div class="slide-button-bg"></div>
            <span class="slide-button-text"></span>
          </a>
        </div>
      </div>

      <div class="footer-postcards">
        <div class="footer-postcard" data-x="-25" data-rotation="-8">
          <img src="https://picsum.photos/seed/postcard-1/700/980" alt="" />
        </div>
        <div class="footer-postcard" data-x="20" data-rotation="6">
          <img src="https://picsum.photos/seed/postcard-2/700/980" alt="" />
        </div>
        <div class="footer-postcard" data-x="-15" data-rotation="-4">
          <img src="https://picsum.photos/seed/postcard-3/700/980" alt="" />
        </div>
        <div class="footer-postcard" data-x="25" data-rotation="10">
          <img src="https://picsum.photos/seed/postcard-4/700/980" alt="" />
        </div>
        <div class="footer-postcard" data-x="-10" data-rotation="-12">
          <img src="https://picsum.photos/seed/postcard-5/700/980" alt="" />
        </div>
      </div>

      <div class="footer-bar">
        <div class="footer-bar-left">
          <p class="sm">&copy;2025 All Rights Reserved</p>
        </div>
        <div class="footer-bar-right">
          <p class="sm">Built by Codegrid</p>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
