<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll Scale Gallery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;700&family=DM+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.cdnfonts.com/css/roslindale" rel="stylesheet" />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="about" id="about">
      <div class="about-header">
        <div class="container">
          <h3>
            An environment built on balance and subtlety, where materials,
            light, and presence create something that feels effortless.
          </h3>

          <div class="section-footer">
            <p class="sm">Maison Dining</p>
            <p class="sm">Fine Setting</p>
          </div>
        </div>
      </div>

      <div class="about-imgs">
        <div class="container">
          <div class="about-img" id="about-img-1">
            <img src="https://picsum.photos/seed/gallery-1/800/800" alt="" />
          </div>
          <div class="about-img" id="about-img-2">
            <img src="https://picsum.photos/seed/gallery-2/800/1120" alt="" />
          </div>
          <div class="about-img" id="about-img-3">
            <img src="https://picsum.photos/seed/gallery-3/800/1000" alt="" />
          </div>
          <div class="about-img" id="about-img-4">
            <img src="https://picsum.photos/seed/gallery-4/800/800" alt="" />
          </div>
          <div class="about-img" id="about-img-5">
            <img src="https://picsum.photos/seed/gallery-5/800/800" alt="" />
          </div>
          <div class="about-img" id="about-img-6">
            <img src="https://picsum.photos/seed/gallery-6/800/1120" alt="" />
          </div>
        </div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
