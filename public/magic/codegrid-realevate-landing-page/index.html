<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Editorial | Codegrid</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav>
      <div class="nav-item">
        <a href="/about">Archive</a>
      </div>
      <div class="nav-item">
        <a href="/">
          <img src="assets/logo.svg" alt="" />
        </a>
      </div>
      <div class="nav-item">
        <a href="/contact">Commission</a>
      </div>
    </nav>

    <section class="hero">
      <div class="marquee">
        <div class="marquee-track">
          <h1>Long Exposure</h1>
          <h1>Long Exposure</h1>
          <h1>Long Exposure</h1>
          <h1>Long Exposure</h1>
          <h1>Long Exposure</h1>
        </div>
      </div>

      <div class="hero-copy">
        <p>
          A growing archive of people, places and the small moments between
          them.
        </p>
        <div class="hero-callout">
          <p>Exhibition Opens 14 Nov</p>
        </div>
      </div>

      <div class="hero-overlay">
        <div class="counter">
          <div class="digit-col"></div>
          <div class="digit-col"></div>
        </div>
      </div>

      <div class="hero-img-wrapper">
        <div class="hero-img"><img src="assets/img1.jpg" alt="" /></div>
        <div class="hero-img"><img src="assets/img2.jpg" alt="" /></div>
        <div class="hero-img"><img src="assets/img3.jpg" alt="" /></div>
        <div class="hero-img"><img src="assets/img4.jpg" alt="" /></div>
        <div class="hero-img"><img src="assets/img5.jpg" alt="" /></div>
        <div class="hero-img"><img src="assets/img6.jpg" alt="" /></div>
      </div>
    </section>

    <footer>
      <p>Lumen &copy; 2026</p>
      <p>Est. Copenhagen</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/CustomEase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
