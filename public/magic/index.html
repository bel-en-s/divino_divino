<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magias DD — Galería de Efectos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #0d0d0f;
        --fg: #f4f2ee;
        --muted: #8a8790;
        --accent: #c9f24f;
        --border: rgba(255, 255, 255, 0.08);
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--fg);
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 3rem 1.5rem;
      }

      .wrap {
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
      }

      header {
        margin-bottom: 2.5rem;
      }

      header .eyebrow {
        font-size: 0.75rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.75rem;
      }

      header h1 {
        font-size: clamp(2rem, 6vw, 3.25rem);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.02em;
      }

      ol {
        list-style: none;
        border-top: 1px solid var(--border);
      }

      li {
        border-bottom: 1px solid var(--border);
      }

      a {
        display: flex;
        align-items: baseline;
        gap: 1.25rem;
        padding: 1.35rem 0.25rem;
        color: var(--fg);
        text-decoration: none;
        transition: color 0.2s ease, padding-left 0.2s ease;
      }

      a:hover {
        color: var(--accent);
        padding-left: 0.75rem;
      }

      .index {
        font-size: 0.8rem;
        color: var(--muted);
        min-width: 2rem;
        font-variant-numeric: tabular-nums;
      }

      .name {
        font-size: 1.25rem;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      footer {
        margin-top: 2.5rem;
        color: var(--muted);
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <p class="eyebrow">Magias DD</p>
        <h1>Galería de efectos</h1>
      </header>

      <ol>
        <li>
          <a href="./transicion-entrar-al-mundo/">
            <span class="index">01</span>
            <span class="name">Transición Entrar al Mundo</span>
          </a>
        </li>
        <li>
          <a href="./01-scroll-scale-gallery/">
            <span class="index">02</span>
            <span class="name">Scroll Scale Gallery</span>
          </a>
        </li>
        <li>
          <a href="./02-postcards-hover-gallery/">
            <span class="index">03</span>
            <span class="name">Postcards Hover Gallery</span>
          </a>
        </li>
        <li>
          <a href="./codegrid-and2es-3d-slider/">
            <span class="index">04</span>
            <span class="name">3D Orbit Slider</span>
          </a>
        </li>
        <li>
          <a href="./codegrid-glitchandgrit-infinite-slider/">
            <span class="index">05</span>
            <span class="name">GlitchAndGrit Infinite Slider</span>
          </a>
        </li>
        <li>
          <a href="./codegrid-livespot360-landing-page-reveal/">
            <span class="index">06</span>
            <span class="name">LiveSpot360 Landing Page Reveal</span>
          </a>
        </li>
      </ol>

      <footer>Hacé click en un efecto para verlo en pantalla completa.</footer>
    </div>
  </body>
</html>
