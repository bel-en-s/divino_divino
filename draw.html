<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIVINO DIVINO — Draw</title>

  <link rel="icon" href="./estrella-favicon.png">
  <meta name="theme-color" content="#000000">
  <meta name="author" content="DIVINO DIVINO">

  <link rel="stylesheet" href="./globals.css">
  <link rel="stylesheet" href="./css/preloader.css">
  <link rel="stylesheet" href="./css/transition.css">
  <link rel="stylesheet" href="./css/menu.css">
  <link rel="stylesheet" href="./css/home.css">
  <link rel="stylesheet" href="./css/draw.css">
</head>

<body>

  <nav>
    <div class="container">
      <div class="logo">
        <div class="logo-container">
          <a href="./">DIVINO <span></span>DIVINO</a>
        </div>
      </div>
      <div class="menu-toggle-btn">
        <div class="menu-toggle-btn-wrapper">
          <p>Menu</p>
        </div>
      </div>
    </div>
  </nav>

  <div class="nav-overlay dark-nav">
    <div class="nav-items">
      <div class="nav-item"><a href="./">Index</a></div>
      <div class="nav-item"><a href="./contact.html">Contact</a></div>
    </div>
  </div>

  <section class="hero" id="draw-hero">

    <video class="hero-video" autoplay muted loop playsinline>
      <source src="./hero/hero.mp4" type="video/mp4" />
    </video>

    <!-- EXPERIENCES CONTAINERS -->
    <div class="experience-container active" id="exp-pajaro">
      <!-- El VIDEO oculto del que se extraen los frames -->
      <video src="/public/ave.mp4" id="ave-gif" autoplay loop muted playsinline
        style="opacity: 0.001; position: absolute; left: 0; top: 0; width: px; height: 5px; z-index:-1; pointer-events:none;"></video>
      <!-- El canvas donde se dibuja el ASCII -->
      <canvas id="ave-ascii-canvas" style=" inset:0; width:50%; height:50%; z-index:1; pointer-events:none;"></canvas>
    </div>

    <div class="experience-container" id="exp-logo">
      <div class="draw-logo">
        <img src="/public/logo.png" alt="DIVINO DIVINO" draggable="false">
      </div>
    </div>

    <div class="experience-container" id="exp-dibujar">
      <!-- Grilla blanca sutil (canvas o html grid) -->
      <div class="grid-layer"></div>
    </div>

    <!-- MENU INFERIOR -->
    <div class="draw-bottom-nav">
      <button class="exp-btn exp-btn--image active" data-target="exp-pajaro">
        <img src="/public/ave.png" alt="Ave" />
      </button>
      <button class="exp-btn exp-btn--image" data-target="exp-logo">
        <img src="/public/destello.png" alt="Logo" />
      </button>
      <button class="exp-btn exp-btn--image" data-target="exp-dibujar">
        <img src="/public/lapicera.png" alt="Dibujar" />
      </button>
    </div>

    <!-- UI GLOBAL (VIDEO) -->
    <aside class="draw-ui draw-ui--global" id="draw-ui-global">
      <div class="draw-ui__body" data-lenis-prevent>
        <div class="global-controls">
          <h4 style="margin-bottom: 10px; font-weight:bold; font-size: 0.8rem; letter-spacing:1px; color:#fff;">VIDEO
            BACKGROUND</h4>

          <div class="ctrl-group">
            <div class="ctrl-label">
              <span>TAMAÑO PIXEL</span>
              <output id="out-pixel">120</output>
            </div>
            <input class="ctrl-range" type="range" id="ctrl-pixel" min="10" max="300" value="120" step="1">
          </div>

          <div class="ctrl-group" style="margin-top: 15px;">
            <div class="ctrl-label"><span>PINCEL INTERACTIVO</span></div>
            <div class="ctrl-pills">
              <button class="pill" id="btn-draw-on">ON</button>
              <button class="pill active" id="btn-draw-off">OFF</button>
            </div>
          </div>

        </div>
        <!-- RESET GLOBALES -->
        <div class="ctrl-group" style="margin-top: 20px;">
          <button class="draw-ui__reset" id="ctrl-reset">Reset all</button>
        </div>
      </div>
    </aside>

    <!-- UI CONTEXT (HERRAMIENTAS) -->
    <aside class="draw-ui draw-ui--context" id="draw-ui-context">
      <div class="draw-ui__body" data-lenis-prevent>

        <!-- CONTROLES PÁJARO -->
        <div class="context-controls" id="controls-pajaro" style="display:none;">
          <h4 style="margin-bottom: 10px; font-weight:bold; font-size: 0.8rem; letter-spacing:1px; color:#fff;">AVE
            SETTINGS</h4>
          <div class="ctrl-group">
            <div class="ctrl-label">
              <span>Densidad ASCII</span>
              <output id="out-ave-density">8</output>
            </div>
            <input class="ctrl-range" type="range" id="ctrl-ave-density" min="2" max="32" value="8" step="1">
          </div>
          <div class="ctrl-group">
            <div class="ctrl-label">
              <span>Brillo</span>
            </div>
            <input class="ctrl-range" type="range" id="ctrl-ave-brightness" min="-1" max="1" value="0.0" step="0.05">
          </div>
          <div class="ctrl-group">
            <div class="ctrl-label">
              <span>Contraste</span>
            </div>
            <input class="ctrl-range" type="range" id="ctrl-ave-contrast" min="0" max="3" value="1.0" step="0.05">
          </div>
          <div class="ctrl-group">
            <div class="ctrl-label">
              <span>Umbral (Fondo)</span>
            </div>
            <input class="ctrl-range" type="range" id="ctrl-ave-threshold" min="0" max="1" value="1.0" step="0.01">
          </div>
        </div>

        <!-- CONTROLES LOGO -->
        <div class="context-controls" id="controls-logo" style="display:none;">
          <h4 style="margin-bottom: 10px; font-weight:bold; font-size: 0.8rem; letter-spacing:1px; color:#fff;">LOGO
            SETTINGS</h4>
          <div class="ctrl-group">
            <div class="ctrl-label">
              <span>Radio Pincel</span>
              <output id="out-logo-radius">0.35</output>
            </div>
            <input class="ctrl-range" type="range" id="ctrl-logo-radius" min="0.05" max="1.5" value="0.35" step="0.01">
          </div>
        </div>

        <!-- CONTROLES DIBUJAR -->
        <div class="context-controls" id="controls-dibujar" style="display:block;">

          <h4
            style="margin-bottom: 15px; font-weight:bold; text-transform:uppercase; font-size: 0.8rem; letter-spacing:1px; color:#fff;">
            DRAWING SETTINGS</h4>

          <div class="ctrl-group">
            <div class="ctrl-label"><span>Drawing Mode</span></div>
            <div class="ctrl-pills">
              <button class="pill active" id="btn-draw-normal">normal</button>
              <button class="pill" id="btn-draw-45">45°</button>
              <button class="pill" id="btn-draw-n45">-45°</button>
            </div>
          </div>

          <div class="ctrl-group" style="margin-top: 15px;">
            <div class="ctrl-label">
              <span>Width</span>
              <output id="out-draw-width">1</output>
            </div>
            <input class="ctrl-range" type="range" id="ctrl-draw-width" min="1" max="10" value="1" step="1">
          </div>

          <div class="ctrl-group">
            <div class="ctrl-label">
              <span>Height</span>
              <output id="out-draw-height">1</output>
            </div>
            <input class="ctrl-range" type="range" id="ctrl-draw-height" min="1" max="10" value="1" step="1">
          </div>

          <div class="ctrl-group" style="margin-bottom: 25px;">
            <div class="ctrl-label">
              <span>Radius</span>
              <output id="out-draw-radius">25</output>
            </div>
            <input class="ctrl-range" type="range" id="ctrl-draw-radius" min="0" max="100" value="25" step="1">
          </div>

          <h4
            style="margin-bottom: 15px; font-weight:bold; text-transform:uppercase; font-size: 0.8rem; letter-spacing:1px; color:#fff;">
            GRID SETTINGS</h4>

          <div class="ctrl-group">
            <div class="ctrl-label">
              <span>Grid X</span>
              <output id="out-grid-x">80</output>
            </div>
            <input class="ctrl-range" type="range" id="ctrl-grid-x" min="10" max="250" value="80" step="1">
          </div>

          <div class="ctrl-group" style="margin-bottom: 25px;">
            <div class="ctrl-label">
              <span>Grid Y</span>
              <output id="out-grid-y">60</output>
            </div>
            <input class="ctrl-range" type="range" id="ctrl-grid-y" min="10" max="250" value="60" step="1">
          </div>

          <div class="ctrl-group">
            <div class="ctrl-pills" style="display:grid; grid-template-columns: 1fr 1fr 1fr;">
              <button class="pill" id="btn-draw-clear">clear</button>
              <button class="pill" id="btn-draw-undo">undo</button>
              <button class="pill" id="btn-draw-redo">redo</button>
            </div>
          </div>

        </div>


      </div>
    </aside>

  </section>

  <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
  <script type="module" src="/scripts/menu.js"></script>
  <script type="module" src="/scripts/transition.js"></script>
  <script type="module" src="/scripts/lenis-scroll.js"></script>

  <script type="module" src="./scripts/draw.js"></script>
  <script type="module" src="./scripts/draw-ave.js"></script>
  <script type="module" src="./scripts/draw-logo.js"></script>
  <script type="module" src="./scripts/draw-lapicera.js"></script>

</body>

</html>
