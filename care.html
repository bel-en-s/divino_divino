    <script>
      const stars = document.querySelectorAll('.care-star');
      window.addEventListener('scroll', () => {
        const deg = window.scrollY * 0.1;
        stars.forEach(s => s.style.transform = `rotate(${deg}deg)`);
      });
    </script>
    <script>
      (function () {
        const steps = {
          region: document.querySelector('[data-step="region"]'),
          ar: document.querySelector('[data-step="ar"]'),
          intl: document.querySelector('[data-step="intl"]'),
        };
        const backBtn = document.querySelector('.care-back');

        function showStep(name) {
          Object.keys(steps).forEach((k) => {
            if (steps[k]) steps[k].hidden = k !== name;
          });
          if (backBtn) backBtn.hidden = name === 'region';
          if (name === 'intl') loadPayPal();
        }

        document.querySelectorAll('[data-region]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const r = btn.getAttribute('data-region');
            showStep(r === 'ar' ? 'ar' : 'intl');
          });
        });

        if (backBtn) backBtn.addEventListener('click', () => showStep('region'));

        const PAYPAL_PLAN_ID = 'P-1LY42344K16322315NKWUCFY';
        const PAYPAL_CLIENT_ID = 'BAA1YFy1BAnEfmSwGt7fKvgDcdtF_QBvhX4vFQYRjWDjB7WAnLXEqemIvr6av1iXbt1-KyKo5Sl0x9P9XM';
        let paypalRendered = false;

        function notifyOwnerIntl(payload, subscriptionID) {
          const fd = new FormData();
          fd.append('access_key', '79647389-1e07-49c9-b7cc-7a4a64acfb94');
          fd.append('subject', 'Nueva suscripción Internacional (PayPal)');
          fd.append('from_name', 'DIVINO DIVINO — Suscripciones');
          fd.append('name', payload.name || '');
          fd.append('email', payload.email || '');
          fd.append(
            'message',
            'Nueva suscripción internacional al plan Web Dominio + Hosting.\n\n' +
              'Nombre: ' + (payload.name || '-') + '\n' +
              'Email: ' + (payload.email || '-') + '\n' +
              'Dominio deseado: ' + (payload.domain || '-') + '\n' +
              'WhatsApp: ' + (payload.phone || '-') + '\n' +
              'PayPal subscription ID: ' + (subscriptionID || '-') + '\n' +
              'Región: Internacional (PayPal)'
          );
          fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            body: fd,
            keepalive: true,
          }).catch(() => {});
        }

        function readIntlForm() {
          const form = document.getElementById('intlForm');
          if (!form) return { name: '', email: '', domain: '', phone: '' };
          const fd = new FormData(form);
          return {
            name: fd.get('name') || '',
            email: fd.get('email') || '',
            domain: fd.get('domain') || '',
            phone: fd.get('phone') || '',
          };
        }

        function renderPayPal() {
          if (paypalRendered || !window.paypal) return;
          const container = document.getElementById('paypal-button-container-' + PAYPAL_PLAN_ID);
          if (!container) return;
          paypalRendered = true;
          paypal.Buttons({
            style: {
              shape: 'pill',
              color: 'black',
              layout: 'vertical',
              label: 'subscribe',
            },
            createSubscription: function (data, actions) {
              return actions.subscription.create({ plan_id: PAYPAL_PLAN_ID });
            },
            onApprove: function (data, actions) {
              notifyOwnerIntl(readIntlForm(), data.subscriptionID);
              const result = document.getElementById('intlResult');
              if (result) {
                result.style.display = 'block';
                result.style.color = 'var(--tone-500)';
              }
            },
          }).render('#' + container.id);
        }

        function loadPayPal() {
          if (window.paypal) {
            renderPayPal();
            return;
          }
          const s = document.createElement('script');
          s.src = 'https://www.paypal.com/sdk/js?client-id=' + PAYPAL_CLIENT_ID + '&vault=true&intent=subscription';
          s.setAttribute('data-sdk-integration-source', 'button-factory');
          s.onload = renderPayPal;
          document.head.appendChild(s);
        }

        showStep('region');
      })();
    </script>
