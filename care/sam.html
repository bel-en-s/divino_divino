    <script>document.getElementById("year").textContent = new Date().getFullYear()</script>
    <script>
      const stars = document.querySelectorAll('.care-star');
      window.addEventListener('scroll', () => {
        const deg = window.scrollY * 0.1;
        stars.forEach(s => s.style.transform = `rotate(${deg}deg)`);
      });
    </script>
    <script>
      (function () {
        const PAYPAL_PLAN_ID = 'P-3KU65575B6385092MNL7QO4I';
        const PAYPAL_CLIENT_ID = 'BAA1YFy1BAnEfmSwGt7fKvgDcdtF_QBvhX4vFQYRjWDjB7WAnLXEqemIvr6av1iXbt1-KyKo5Sl0x9P9XM';

        function notifyOwner(subscriptionID) {
          const fd = new FormData();
          fd.append('access_key', '79647389-1e07-49c9-b7cc-7a4a64acfb94');
          fd.append('subject', 'Nueva suscripción Sam (PayPal)');
          fd.append('from_name', 'DIVINO DIVINO — Suscripciones');
          fd.append(
            'message',
            'Nueva suscripción al plan Sam.\n\nPayPal subscription ID: ' + (subscriptionID || '-') + '\nRegión: Internacional (PayPal)'
          );
          fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            body: fd,
            keepalive: true,
          }).catch(() => {});
        }

        function renderPayPal() {
          const container = document.getElementById('paypal-button-container-' + PAYPAL_PLAN_ID);
          if (!container) return;
          paypal.Buttons({
            style: {
              shape: 'pill',
              color: 'black',
              layout: 'vertical',
              label: 'subscribe',
            },
            createSubscription: function (data, actions) {
              return actions.subscription.create({ plan_id: PAYPAL_PLAN_ID });
            },
            onApprove: function (data, actions) {
              notifyOwner(data.subscriptionID);
              const result = document.getElementById('samResult');
              if (result) {
                result.textContent = '¡Gracias! Tu suscripción quedó registrada.';
                result.style.color = 'var(--tone-500)';
              }
            },
          }).render('#' + container.id);
        }

        function loadPayPal() {
          if (window.paypal) {
            renderPayPal();
            return;
          }
          const s = document.createElement('script');
          s.src = 'https://www.paypal.com/sdk/js?client-id=' + PAYPAL_CLIENT_ID + '&vault=true&intent=subscription';
          s.setAttribute('data-sdk-integration-source', 'button-factory');
          s.onload = renderPayPal;
          document.head.appendChild(s);
        }

        loadPayPal();
      })();
    </script>
    <script type="module" src="/scripts/lenis-scroll.js"></script>
    <script type="module" src="/scripts/transition.js"></script>
    <script type="module" src="/scripts/menu.js"></script>
    <script type="module" src="/scripts/i18n.js"></script>
