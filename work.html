    <style>
      .work-reel-section {
        height: 100vh;
        background: #fff;
        display: flex;
        flex-direction: column;

      .work-reel-star {

        justify-content: center;
        align-items: center;
        flex-shrink: 0;
        padding-top: 2rem;
      }
      .work-reel {
        flex: 1;
        overflow: hidden;
        min-height: 0;
        perspective: 1200px;
      }
      .work-reel-inner {
        display: flex;
        height: 100%;
        align-items: center;
        gap: 0;
        will-change: transform;
        transform-style: preserve-3d;
      }
      .work-reel video {
        height: auto;
        max-height: 100%;
        width: calc(100vw / 3);
        flex-shrink: 0;
        object-fit: cover;
      }
    </style>

    <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="./scripts/film.js"></script>
    <script>
      gsap.registerPlugin(ScrollTrigger);

      gsap.to(".work-star", {
        rotate: 360,
        duration: 6,
        ease: "none",
        repeat: -1,
      });

      const reel = document.querySelector(".work-reel-inner");
      if (reel) {
        const videos = reel.querySelectorAll("video");
        const totalWidth = (videos.length / 3 - 1) * window.innerWidth;
        gsap.to(reel, {
          x: -totalWidth,
          ease: "none",
          scrollTrigger: {
            trigger: ".work-reel-section",
            start: "top top",
            end: "+=" + (videos.length / 3) * window.innerHeight,
            scrub: 1,
            pin: true,
          },
        });
      }
    </script>
